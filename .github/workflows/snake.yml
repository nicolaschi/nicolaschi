name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1e223d&color_dots=#f2eadb,#eaad88,#ee8b61,#f26a3a,#f54f1b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e6d5b7&color_dots=#1e223d,#5f3033,#943b2a,#ca4622,#f54f1b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
