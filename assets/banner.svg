<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title">
  <title id="title">Chinedu Ogeleka. Full-stack developer in Lagos, Nigeria: Laravel, payments and APIs.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13141f"/>
      <stop offset="0.55" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#2a1b4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c0caf5" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="300" cy="170" r="300" fill="url(#glow)"/>
    <circle cx="1120" cy="40" r="260" fill="url(#glow2)"/>

    <!-- Editor window -->
    <g transform="translate(64 48)">
      <rect width="480" height="224" rx="12" fill="#16161e" stroke="#2f3149"/>
      <path d="M12 0h456a12 12 0 0 1 12 12v24H0V12A12 12 0 0 1 12 0z" fill="#1f2030"/>
      <circle cx="20" cy="18" r="5.5" fill="#f7768e"/>
      <circle cx="38" cy="18" r="5.5" fill="#e0af68"/>
      <circle cx="56" cy="18" r="5.5" fill="#9ece6a"/>
      <text x="240" y="22.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#565f89">app/Ship.php</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" xml:space="preserve">
        <g fill="#3b3f5c" text-anchor="end">
          <text x="34" y="68">1</text>
          <text x="34" y="92">2</text>
          <text x="34" y="116">3</text>
          <text x="34" y="140">4</text>
          <text x="34" y="164">5</text>
          <text x="34" y="188">6</text>
          <text x="34" y="212">7</text>
        </g>
        <text x="50" y="68" fill="#c0caf5"><tspan fill="#bb9af7">$project</tspan> = <tspan fill="#7dcfff">Project</tspan>::<tspan fill="#7aa2f7">create</tspan>(<tspan fill="#bb9af7">$brief</tspan>);</text>
        <text x="50" y="116" fill="#c0caf5"><tspan fill="#bb9af7">$project</tspan>-&gt;<tspan fill="#7aa2f7">build</tspan>()</text>
        <text x="122" y="140" fill="#c0caf5">-&gt;<tspan fill="#7aa2f7">test</tspan>()<tspan x="239" fill="#565f89">// Pest</tspan></text>
        <text x="122" y="164" fill="#c0caf5">-&gt;<tspan fill="#7aa2f7">deploy</tspan>();<tspan x="239" fill="#565f89">// Actions → AWS</tspan></text>
        <text x="50" y="212" fill="#c0caf5"><tspan fill="#bb9af7">return</tspan> <tspan fill="#9ece6a">'shipped'</tspan>; <tspan fill="#565f89">// 400+ times</tspan></text>
      </g>
    </g>

    <!-- Name and role -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="604" y="140" font-size="64" font-weight="800" fill="#ffffff" textLength="612" lengthAdjust="spacing">CHINEDU OGELEKA</text>
      <rect x="606" y="164" width="140" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="604" y="210" font-size="21" font-weight="600" fill="#c0caf5">Full-Stack Developer  ·  Laravel  ·  Payments  ·  APIs</text>
      <text x="604" y="246" font-size="17" fill="#7f88b5">Lagos, Nigeria  ·  400+ projects for clients in NG, UK, IE and PT</text>
    </g>
  </g>
</svg>
