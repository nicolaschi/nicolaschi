<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title">
  <title id="title">Chinedu Ogeleka. Full-stack developer in Lagos, Nigeria: Laravel, payments and APIs.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a2f"/>
      <stop offset="0.55" stop-color="#1e223d"/>
      <stop offset="1" stop-color="#262a48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f54f1b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f54f1b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6d5b7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e6d5b7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e6d5b7" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="300" cy="170" r="300" fill="url(#glow)"/>
    <circle cx="1120" cy="40" r="260" fill="url(#glow2)"/>

    <!-- Editor window -->
    <g transform="translate(64 48)">
      <rect width="480" height="224" rx="12" fill="#161a2e" stroke="#323449"/>
      <path d="M12 0h456a12 12 0 0 1 12 12v24H0V12A12 12 0 0 1 12 0z" fill="#191c32"/>
      <circle cx="20" cy="18" r="5.5" fill="#f54f1b"/>
      <circle cx="38" cy="18" r="5.5" fill="#e6d5b7"/>
      <circle cx="56" cy="18" r="5.5" fill="#787274"/>
      <text x="240" y="22.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#787274">app/Ship.php</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" xml:space="preserve">
        <g fill="#3c3d4f" text-anchor="end">
          <text x="34" y="68">1</text>
          <text x="34" y="92">2</text>
          <text x="34" y="116">3</text>
          <text x="34" y="140">4</text>
          <text x="34" y="164">5</text>
          <text x="34" y="188">6</text>
          <text x="34" y="212">7</text>
        </g>
        <text x="50" y="68" fill="#e6d5b7"><tspan fill="#f54f1b">$project</tspan> = <tspan font-weight="700">Project</tspan>::<tspan fill="#ef8559">create</tspan>(<tspan fill="#f54f1b">$brief</tspan>);</text>
        <text x="50" y="116" fill="#e6d5b7"><tspan fill="#f54f1b">$project</tspan>-&gt;<tspan fill="#ef8559">build</tspan>()</text>
        <text x="122" y="140" fill="#e6d5b7">-&gt;<tspan fill="#ef8559">test</tspan>()<tspan x="239" fill="#787274">// Pest</tspan></text>
        <text x="122" y="164" fill="#e6d5b7">-&gt;<tspan fill="#ef8559">deploy</tspan>();<tspan x="239" fill="#787274">// Actions → AWS</tspan></text>
        <text x="50" y="212" fill="#e6d5b7"><tspan fill="#f54f1b">return</tspan> 'shipped'; <tspan fill="#787274">// 400+ times</tspan></text>
      </g>
    </g>

    <!-- Name and role -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="604" y="140" font-size="64" font-weight="800" fill="#e6d5b7" textLength="612" lengthAdjust="spacing">CHINEDU OGELEKA</text>
      <rect x="606" y="164" width="140" height="5" rx="2.5" fill="#f54f1b"/>
      <text x="604" y="210" font-size="21" font-weight="600" fill="#e6d5b7">Full-Stack Developer  ·  Laravel  ·  Payments  ·  APIs</text>
      <text x="604" y="246" font-size="17" fill="#968d86">Lagos, Nigeria  ·  400+ projects for clients in NG, UK, IE and PT</text>
    </g>
  </g>
</svg>
