<svg xmlns="http://www.w3.org/2000/svg" width="380" height="370" viewBox="0 0 380 370" role="img" aria-labelledby="title">
  <title id="title">Terminal: php artisan test passes 3 payment tests, then git push origin main runs the tests on GitHub Actions and deploys to production.</title>
  <defs>
    <clipPath id="type1"><rect x="36.8" y="64" width="0" height="22"><animate attributeName="width" values="0.0;8.4;16.8;25.2;33.6;42.0;50.4;58.8;67.2;75.6;84.0;92.4;100.8;109.2;117.6;126.0;380" calcMode="discrete" begin="0.7s" dur="1.02s" fill="freeze"/></rect></clipPath>
    <clipPath id="type7"><rect x="36.8" y="262" width="0" height="22"><animate attributeName="width" values="0.0;8.4;16.8;25.2;33.6;42.0;50.4;58.8;67.2;75.6;84.0;92.4;100.8;109.2;117.6;126.0;134.4;142.8;151.2;159.6;380" calcMode="discrete" begin="4.5s" dur="1.26s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="379" height="369" rx="12" fill="#1a1b27" stroke="#2f3149"/>
  <path d="M12.5 0.5h355a12 12 0 0 1 12 12v21.5H0.5V12.5a12 12 0 0 1 12-12z" fill="#16161e"/>
  <circle cx="20" cy="17" r="5.5" fill="#f7768e"/>
  <circle cx="38" cy="17" r="5.5" fill="#e0af68"/>
  <circle cx="56" cy="17" r="5.5" fill="#9ece6a"/>
  <text x="190.0" y="21.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#565f89">zsh: bucklid</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/>
      <text x="20" y="60" xml:space="preserve"><tspan x="20.0" fill="#7dcfff">~/bucklid</tspan><tspan x="104.0" fill="#565f89">on</tspan><tspan x="129.2" fill="#bb9af7">main</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="0.5s" fill="freeze"/>
      <text x="20" y="82" xml:space="preserve"><tspan x="20.0" fill="#9ece6a">❯</tspan></text>
      <text x="36.8" y="82" fill="#c0caf5" clip-path="url(#type1)">php artisan test</text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/>
      <rect x="32.8" y="113" width="41.6" height="19" rx="3" fill="#9ece6a"/>
      <text x="20" y="126" xml:space="preserve"><tspan x="36.8" fill="#1a1b27" font-weight="700">PASS</tspan><tspan x="87.2" fill="#c0caf5">Tests\Feature\PaymentTest</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/>
      <text x="20" y="148" xml:space="preserve"><tspan x="36.8" fill="#9ece6a">✓</tspan><tspan x="53.6" fill="#565f89">webhook signature is verified</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="2.9s" fill="freeze"/>
      <text x="20" y="170" xml:space="preserve"><tspan x="36.8" fill="#9ece6a">✓</tspan><tspan x="53.6" fill="#565f89">escrow releases after approval</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/>
      <text x="20" y="192" xml:space="preserve"><tspan x="36.8" fill="#9ece6a">✓</tspan><tspan x="53.6" fill="#565f89">only admins can issue refunds</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/>
      <text x="20" y="236" xml:space="preserve"><tspan x="36.8" fill="#565f89">Tests:</tspan><tspan x="104.0" fill="#9ece6a">3 passed</tspan><tspan x="179.6" fill="#565f89">(9 assertions)</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="4.3s" fill="freeze"/>
      <text x="20" y="280" xml:space="preserve"><tspan x="20.0" fill="#9ece6a">❯</tspan></text>
      <text x="36.8" y="280" fill="#c0caf5" clip-path="url(#type7)">git push origin main</text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="6.0s" fill="freeze"/>
      <text x="20" y="302" xml:space="preserve"><tspan x="36.8" fill="#9ece6a">✓</tspan><tspan x="53.6" fill="#c0caf5">tests passed on GitHub Actions</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="6.5s" fill="freeze"/>
      <text x="20" y="324" xml:space="preserve"><tspan x="36.8" fill="#9ece6a">✓</tspan><tspan x="53.6" fill="#c0caf5">deployed to production</tspan></text>
    </g>
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="7.0s" fill="freeze"/>
      <text x="20" y="346" xml:space="preserve"><tspan x="20.0" fill="#9ece6a">❯</tspan></text>
    </g>
    <rect x="36.8" y="333" width="8.4" height="17" fill="#c0caf5" opacity="0"><animate attributeName="opacity" values="1;0" calcMode="discrete" begin="7.0s" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
